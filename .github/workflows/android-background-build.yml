name: Android Full Build

on:
  push:
    branches:
      - main
      - master
      - release/**
  pull_request:
    branches:
      - main
      - master
      - release/**
  workflow_dispatch:

concurrency:
  group: android-full-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-build:
    name: Complete Background Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run native host tests
        run: |
          cmake -S app/src/main/cpp -B /tmp/androidsa-native-tests -DANDROIDSA_ENABLE_NATIVE_TESTS=ON
          cmake --build /tmp/androidsa-native-tests --target client_state_test
          ctest --test-dir /tmp/androidsa-native-tests --output-on-failure

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build project
        run: ./gradlew --no-daemon check build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
