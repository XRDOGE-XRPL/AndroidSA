name: Android Full Build

on:
  push:
    branches:
      - main
      - master
      - release/**
  pull_request:
    branches:
      - main
      - master
      - release/**
  workflow_dispatch:

concurrency:
  group: android-full-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-build:
    name: Complete Background Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Enable local Google Maven proxy fallback
        shell: bash
        run: |
          if [ -n "${ANDROIDSA_GOOGLE_MAVEN_URL:-}" ]; then
            echo "ANDROIDSA_GOOGLE_MAVEN_URL already configured: ${ANDROIDSA_GOOGLE_MAVEN_URL}"
            exit 0
          fi

          set +e
          python3 - <<'PY'
          import socket
          import sys
          import urllib.request

          try:
              socket.getaddrinfo("dl.google.com", 443)
              with urllib.request.urlopen(
                  "https://dl.google.com/android/repository/repository2-1.xml",
                  timeout=20,
              ) as response:
                  if response.status >= 400:
                      raise RuntimeError(f"Unexpected HTTP status: {response.status}")
          except Exception as exc:
              print(f"Google Maven probe failed: {exc}")
              sys.exit(10)

          print("Google Maven probe succeeded.")
          PY
          probe_status=$?
          set -e

          if [ "$probe_status" -eq 0 ]; then
            exit 0
          fi

          nohup python3 tools/google_maven_proxy.py --host 127.0.0.1 --port 38473 \
            >/tmp/androidsa-google-maven-proxy.log 2>&1 &
          echo "$!" >/tmp/androidsa-google-maven-proxy.pid

          for attempt in $(seq 1 20); do
            if curl --silent --show-error --fail http://127.0.0.1:38473/ >/dev/null; then
              echo "ANDROIDSA_GOOGLE_MAVEN_URL=http://127.0.0.1:38473/" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done

          echo "Local Google Maven proxy did not become ready."
          cat /tmp/androidsa-google-maven-proxy.log
          exit 1

      - name: Warm Gradle plugin and dependency resolution (retry)
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon help --stacktrace --refresh-dependencies && break
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle dependency warmup failed after 3 attempts"
              exit 1
            fi
            echo "Warmup failed (attempt $attempt), retrying..."
            sleep 10
          done

      - name: Run native host tests
        run: |
          cmake -S app/src/main/cpp -B /tmp/androidsa-native-tests -DANDROIDSA_ENABLE_NATIVE_TESTS=ON
          cmake --build /tmp/androidsa-native-tests --target client_state_test
          ctest --test-dir /tmp/androidsa-native-tests --output-on-failure

      - name: Run unit tests (retry)
        run: |
          for attempt in 1 2; do
            ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace && break
            if [ "$attempt" -eq 2 ]; then
              echo "Unit tests failed after retry"
              exit 1
            fi
            echo "Unit tests failed (attempt $attempt), retrying with refreshed dependencies..."
            ./gradlew --no-daemon help --stacktrace --refresh-dependencies
            sleep 5
          done

      - name: Run Android emulator UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Assemble app artifacts (retry)
        run: |
          for attempt in 1 2; do
            ./gradlew --no-daemon :app:assemble --stacktrace && break
            if [ "$attempt" -eq 2 ]; then
              echo "Assemble failed after retry"
              exit 1
            fi
            echo "Assemble failed (attempt $attempt), retrying with refreshed dependencies..."
            ./gradlew --no-daemon :app:assemble --stacktrace --refresh-dependencies
          done

      - name: Stop local Google Maven proxy
        if: always()
        run: |
          if [ -f /tmp/androidsa-google-maven-proxy.pid ]; then
            kill "$(cat /tmp/androidsa-google-maven-proxy.pid)" || true
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
